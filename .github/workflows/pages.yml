name: Cloudflare Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: steppe-atlas-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
      - name: Deploy to Cloudflare Pages
        run: npm run deploy -- --commit-hash "$GITHUB_SHA" --commit-dirty=false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the production domain
        run: |
          for file in index.html kk/index.html ru/index.html; do
            route="${file%index.html}"
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --max-time 10 \
                "https://kazakhstan.drugoi.dev/$route" -o "$RUNNER_TEMP/deployed-atlas.html" &&
                cmp -s "dist/$file" "$RUNNER_TEMP/deployed-atlas.html"; then
                break
              fi
              if [ "$attempt" = 18 ]; then
                echo "::error::Production domain did not return the deployed atlas at /$route."
                exit 1
              fi
              sleep 5
            done
          done
